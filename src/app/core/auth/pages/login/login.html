<div class="login-wrap">
  <aside class="login-brand">
    <i class="bi bi-heart-pulse"></i>
    <h2>Tus mascotas, registradas.</h2>
    <p>Tu tranquilidad, en orden.</p>
  </aside>
  <main class="login-form">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <h1 class="h3 fw-semibold mb-1" style="color: var(--navy)">Iniciar sesión</h1>
      <p class="text-muted mb-4">Accede al panel administrativo.</p>
      <div class="form-floating mb-3">
        <input
          formControlName="email"
          type="email"
          class="form-control"
          [ngClass]="{
            'is-invalid': pf['email'].invalid && (pf['email'].touched || submitted),
          }"
          placeholder="nombre@alpha.com"
          autocomplete="off"
          autofocus
          required
        />
        <label for="correo">Correo electrónico</label>
        @if (pf['email'].hasError('required')) {
          <div class="invalid-feedback">El email es requerido.</div>
        }
      </div>
      <div class="form-floating mb-3">
        <input
          formControlName="password"
          type="password"
          class="form-control"
          [ngClass]="{
            'is-invalid': pf['password'].invalid && (pf['password'].touched || submitted),
          }"
          placeholder="Contraseña"
          autocomplete="off"
          required
        />
        <label for="clave">Contraseña</label>
        @if (pf['password'].hasError('required')) {
          <div class="invalid-feedback">La contraseña es requerida.</div>
        }
      </div>
      <button class="w-100 btn btn-lg btn-primary fw-medium py-2" type="submit">
        Ingresar al sistema
      </button>
      <p class="mt-5 mb-0 text-muted small text-center">&copy; 2026 - Alpha</p>
    </form>
  </main>
</div>
