<alpha-titulo title="Nueva Raza" router="/home/raza" [principalButton]="false"></alpha-titulo>
<form [formGroup]="razaForm" (ngSubmit)="onSubmit()" class="panel needs-validation" novalidate>
  <div class="form-section">
    <div class="row g-3">
      <div class="col-12">
        <label for="especieid" class="form-label">Especie</label>
        <select
          formControlName="especieid"
          class="form-select"
          [ngClass]="{
            'is-invalid': pf['especieid'].invalid && (pf['especieid'].touched || submitted),
          }"
          id="especieid"
          required
        >
          <option value="" selected disabled>Selecciona una especie</option>
          @for (especie of especies(); track especie.id) {
            <option [value]="especie.id">{{ especie.nombre }}</option>
          }
        </select>
        @if (pf['especieid'].hasError('required')) {
          <div class="invalid-feedback">La especie es requerida.</div>
        }
      </div>
      <div class="col-12">
        <label for="nombre" class="form-label">Nombre</label>
        <input
          formControlName="nombre"
          type="text"
          class="form-control"
          [ngClass]="{
            'is-invalid': pf['nombre'].invalid && (pf['nombre'].touched || submitted),
          }"
          id="nombre"
          autocomplete="off"
          autofocus
          required
          maxlength="200"
          placeholder="Nombre de la raza"
        />
        @if (pf['nombre'].hasError('required')) {
          <div class="invalid-feedback">El nombre es requerido.</div>
        }
      </div>
    </div>
  </div>
  <div
    class="d-flex flex-wrap justify-content-end gap-2 p-3 border-top"
    style="background: #fafbfc; border-radius: 0 0 0.75rem 0.75rem"
  >
    <a routerLink="/home/raza" class="btn btn-outline-secondary">Cancelar</a>
    <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Guardar</button>
  </div>
</form>
