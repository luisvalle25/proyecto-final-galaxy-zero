<header class="topbar d-flex align-items-center px-3 px-md-4">
  <button
    (click)="toggleMenu()"
    aria-label="Toggle navigation"
    class="btn-burger me-3"
    type="button"
    aria-label="Abrir o cerrar menú"
    aria-controls="sidebarMenu"
    aria-expanded="true"
  >
    <i class="bi bi-list"></i>
  </button>
  <a class="brand" routerLink="/home/dashboard"
    ><i class="bi bi-heart-pulse"></i> Alpha</a
  >
  <div class="ms-auto d-flex align-items-center gap-3">
    <a class="btn btn-sm btn-outline-light" (click)="cerrar()"
      ><i class="bi bi-box-arrow-right me-1"></i
      ><span class="d-none d-sm-inline">Cerrar sesión</span></a
    >
  </div>
</header>
<div class="app">
  <alpha-menu></alpha-menu>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
